services:
  muse-desktop:
    build:
      context: ../..
      dockerfile: deploy/desktop/Dockerfile
    image: magpie-muse-web-desktop:0.6.0
    restart: unless-stopped
    env_file: .env
    environment:
      MUSE_WEB_HOME: /data
      MUSE_WEB_ENGINE_PORT: "18611"
      MUSE_WEB_ENGINE_HOST: 127.0.0.1
    ports:
      - "127.0.0.1:${DESKTOP_PORT:-6080}:8080"
    volumes:
      - muse-data:/data
    shm_size: 1gb
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - muse
networks:
  muse:
    name: muse-desktop-network
volumes:
  muse-data:
