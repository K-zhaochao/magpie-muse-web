user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        server_name _;
        client_max_body_size 8m;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        location = / {
            return 302 /desktop/vnc.html?autoconnect=1&resize=scale&path=desktop/websockify;
        }
        location /desktop/ {
            auth_basic "Muse login desktop";
            auth_basic_user_file /run/muse-desktop/htpasswd;
            alias /usr/share/novnc/;
            add_header Cache-Control no-cache always;
        }
        location = /desktop/websockify {
            auth_basic "Muse login desktop";
            auth_basic_user_file /run/muse-desktop/htpasswd;
            proxy_pass http://127.0.0.1:6081;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
        location /login/ {
            auth_basic "Muse login desktop";
            auth_basic_user_file /run/muse-desktop/htpasswd;
            proxy_pass http://127.0.0.1:18611;
            proxy_set_header Host $host;
            proxy_buffering off;
        }
        # Bearer authentication is performed by the engine, not by HTTP Basic.
        location /v1/ {
            proxy_pass http://127.0.0.1:18611;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_read_timeout 900s;
        }
        location / { return 404; }
    }
}
